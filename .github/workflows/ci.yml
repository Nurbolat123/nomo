name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nomo
          POSTGRES_PASSWORD: nomo
          POSTGRES_DB: nomo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U nomo" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go mod tidy
      - run: go vet ./...
      - run: go test -race -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://nomo:nomo@localhost:5432/nomo_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [packages/core, apps/passenger, apps/driver]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: if [ -d test ]; then flutter test; fi

  # Builds a debug APK of each app to check the native side (Yandex MapKit,
  # permissions, Gradle). Set the repository secret YANDEX_MAPKIT_KEY to get
  # APKs with Yandex maps; download them from the run's Artifacts.
  android-apk:
    runs-on: ubuntu-latest
    needs: flutter
    strategy:
      matrix:
        app: [passenger, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native project and apply store settings
        run: |
          cd packages/core && flutter pub get && cd ../..
          cd apps/${{ matrix.app }}
          flutter create --org com.nomo --project-name ${{ matrix.app }} --platforms android .
          rm -f test/widget_test.dart
          flutter pub get
          python3 ../../tool/patch_native.py ${{ matrix.app }}
      - name: Build debug APK
        working-directory: apps/${{ matrix.app }}
        env:
          YANDEX_MAPKIT_KEY: ${{ secrets.YANDEX_MAPKIT_KEY }}
          API_URL: ${{ vars.API_URL }}
        run: |
          DEFINES=""
          [ -n "$YANDEX_MAPKIT_KEY" ] && DEFINES="$DEFINES --dart-define=YANDEX_MAPKIT_KEY=$YANDEX_MAPKIT_KEY"
          [ -n "$API_URL" ] && DEFINES="$DEFINES --dart-define=API_URL=$API_URL"
          flutter build apk --debug $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: nomo-${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
