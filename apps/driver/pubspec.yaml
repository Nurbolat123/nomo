name: driver
description: Nomo Driver — app for taxi drivers.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  nomo_core:
    path: ../../packages/core
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../../assets/brand/icon-driver-1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFC93C"
  adaptive_icon_foreground: "../../assets/brand/icon-driver-foreground.png"

flutter_native_splash:
  color: "#FFC93C"
  image: "../../assets/brand/splash-mark-dark.png"
  android_12:
    color: "#FFC93C"
    image: "../../assets/brand/splash-mark-dark.png"
