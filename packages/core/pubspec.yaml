name: nomo_core
description: Shared models, API client, realtime, theme, localization and widgets for the Nomo apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  flutter_map: ^7.0.2
  # Yandex maps and driving routes (full SDK: map + routing).
  yandex_maps_mapkit: ^4.45.0
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
